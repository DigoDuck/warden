[project]
name = "warden"
version = "0.1.0"
description = "Control plane para workloads agentic"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "anthropic>=1.0",
    "pyyaml>=6.0",
    "docker>=7.2.0",
    "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["warden"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.13"
warn_redundant_casts = true
warn_unused_ignores = true
files = ["warden", "tests"]

# strict only in policy/ and core/ (briefing, section 43 item 1). "strict = true"
# is not accepted in a per-module section, so it is expanded into the flags it
# turns on.
[[tool.mypy.overrides]]
module = ["warden.policy.*", "warden.core.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
check_untyped_defs = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

# The Docker SDK ships no py.typed and has no maintained stub package. A narrow override
# rather than a global ignore_missing_imports, so a future untyped dependency still shows up.
[[tool.mypy.overrides]]
module = ["docker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = ["sandbox: needs a working Docker daemon; runs real containers"]
asyncio_mode = "auto"
# Fixtures and tests need the SAME loop: the engine is created once per session,
# and an asyncpg connection opened in one loop cannot be used in another. Leaving
# the defaults ("function" for tests, "session" for fixtures) raises "Event loop
# is closed" on the second test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
