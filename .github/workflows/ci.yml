name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: warden
          POSTGRES_PASSWORD: warden
          POSTGRES_DB: warden
        ports:
          # mesma porta padrao do compose local, para a URL ser identica nos dois lugares
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U warden -d warden"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://warden:warden@localhost:5434/warden

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --directory backend --locked

      - run: uv run --directory backend ruff check

      - run: uv run --directory backend ruff format --check

      - run: uv run --directory backend mypy

      # A migracao inicial foi escrita a mao. `alembic check` compara o schema aplicado
      # com os modelos e falha se alguem mexer num sem mexer no outro.
      - run: uv run --directory backend alembic upgrade head

      - run: uv run --directory backend alembic check

      # The sandbox has no network, so the image tools run in must exist before any test
      # that starts a container. Built here rather than pulled: nothing publishes it yet.
      - run: docker build -t warden-sandbox:dev sandbox-images/python

      # Week 6 / briefing section 43 criterion: policy/ and core/ at >= 80% coverage, each
      # package gated on its own so a well-covered one cannot hide a weak one. `coverage run`
      # (not `pytest --cov`) because pyproject sets parallel + subprocess patching, which makes
      # the worker subprocesses the durability tests spawn report too; `combine` merges them.
      # A worker the tests kill (TerminateProcess/SIGKILL) never writes its data: not counted.
      - run: uv run --directory backend coverage run -m pytest

      - run: uv run --directory backend coverage combine

      - name: Coverage gate, warden/policy
        run: uv run --directory backend coverage report --include="warden/policy/*" --fail-under=80

      - name: Coverage gate, warden/core
        run: uv run --directory backend coverage report --include="warden/core/*" --fail-under=80

  # Week 6 checklist item: "12/12 behavioral evals passam no CI, custo zero" (scoped to the
  # 9 the control plane can express today; 3 are `status: pending` in the dataset). Costs
  # nothing: every case replays a FakeProvider script, never a real model (briefing §19).
  # A separate job, not a step in `backend` above, so a real Postgres it drops and recreates
  # (evals/runner.py's own bootstrap, same recipe as backend/tests/conftest.py) never races
  # the `backend` job's own test database on the same service container.
  behavioral-evals:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: warden
          POSTGRES_PASSWORD: warden
          POSTGRES_DB: warden
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U warden -d warden"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://warden:warden@localhost:5434/warden

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --directory backend --locked

      # evals/ is outside backend/, so the `backend` job's ruff and mypy never see it.
      - run: uv run --project backend ruff check evals/__init__.py evals/checks.py evals/runner.py evals/coding.py evals/coding_checks.py evals/tests
      - run: uv run --project backend ruff format --check evals/__init__.py evals/checks.py evals/runner.py evals/coding.py evals/coding_checks.py evals/tests
      - run: uv run --project backend mypy --config-file backend/pyproject.toml evals/__init__.py evals/checks.py evals/runner.py evals/coding.py evals/coding_checks.py evals/tests

      # `evals-behavioral`'s own Makefile dependency builds the sandbox image (the same one
      # the `backend` job builds, same reason: no network inside it, so it has to exist
      # before any case that runs a real container). Its `pytest evals/tests` step also runs
      # evals/tests/test_coding_runner.py: the coding-eval runner against FakeProvider scripts,
      # which needs this job's Postgres and Docker but no API key. The real `make evals-coding`
      # (anthropic provider) is never run in CI.
      - run: make evals-behavioral

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # gen:api (npm's pre* hooks) shells out to the backend to build its live OpenAPI
      # schema, no Postgres needed for that: openapi_export.py never opens a DB session.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --directory backend --locked

      - run: npm ci --prefix frontend

      - run: npm run --prefix frontend typecheck

      - run: npm run --prefix frontend lint

      - run: npm test --prefix frontend -- --run

  target-repo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: examples/target-repo/uv.lock

      # Same commands examples/target-repo/.github/workflows/ci.yml runs on its own,
      # so the monorepo stays green today and nothing has to change the day this
      # folder is split out into its own repository.
      - run: uv sync --directory examples/target-repo --locked

      - run: uv run --directory examples/target-repo ruff check

      - run: uv run --directory examples/target-repo ruff format --check

      - run: uv run --directory examples/target-repo pytest
